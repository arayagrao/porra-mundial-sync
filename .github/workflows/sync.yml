name: Sync Results

on:
  workflow_dispatch:        # lanzar a mano
  schedule:
    - cron: '*/30 * * * *'  # RED DE SEGURIDAD por si la cadena se rompe

# Solo un bucle a la vez (evita que el relevo y el cron se solapen)
concurrency:
  group: sync-loop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Bucle de sincronizacion (cada 2 min durante ~5h)
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          END=$((SECONDS + 18000))
          N=0
          while [ $SECONDS -lt $END ]; do
            N=$((N+1))
            echo "----- Sync #$N ($(date -u '+%H:%M:%S') UTC) -----"
            node sync.js || echo "sync fallo, sigo"
            sleep 120
          done

      # El propio bucle relanza al siguiente ANTES de morir. Esto NO depende
      # del cron de GitHub, por eso es fiable. Necesita el secreto LOOP_PAT.
      - name: Relanzar el bucle (relevo)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.LOOP_PAT }}
        run: gh workflow run sync.yml --ref ${{ github.ref_name }}
